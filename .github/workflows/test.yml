name: Test
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest
          - os: ubuntu-latest
          - os: ubuntu-latest
            build_args: -Dtarget=x86_64-linux-musl
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: marler8997/setup-anyzig@master
      # wibo runs where the CPU runs x86 code under Linux: its tests run on ubuntu, and build
      # (without running) everywhere else
      - run: |
          zig build install test --summary all ${{ matrix.build_args }}
